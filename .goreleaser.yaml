# goreleaser config for the civitai CLI.
# Build + release binaries and a Homebrew tap formula.
# Docs: https://goreleaser.com
#
# Validate without releasing:
#   goreleaser check
#   goreleaser release --snapshot --clean   # full dry-run into ./dist
version: 2

project_name: civitai

before:
  hooks:
    - go mod tidy

builds:
  - id: civitai
    main: ./cmd/civitai
    binary: civitai
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: civitai
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

