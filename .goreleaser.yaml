# goreleaser config for the civitai CLI.
# Build + release binaries and a Homebrew tap formula.
# Docs: https://goreleaser.com
#
# Validate without releasing:
#   goreleaser check
#   goreleaser release --snapshot --clean   # full dry-run into ./dist
version: 2

project_name: civitai

before:
  hooks:
    - go mod tidy

builds:
  - id: civitai
    main: ./cmd/civitai
    binary: civitai
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: civitai
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
    format_overrides:
      - goos: windows
        formats: [zip]
  # Raw (uncompressed) binary archive so the npm wrapper can download a bare
  # executable directly from the GitHub Release — no tar/zip extraction in the
  # postinstall. Named e.g. civitai_0.1.40_linux_amd64 (+ .exe on windows).
  # These also get sha256 entries in checksums.txt for the wrapper to verify.
  - id: civitai-raw
    ids: [civitai]
    formats: [binary]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    # 🔴 THE OPTIONAL SCOPE GROUP IS LOAD-BEARING. These anchors used to read
    # "^docs:" / "^test:" / "^chore:", which match only the UNSCOPED
    # conventional-commit form. This repo writes scoped subjects
    # (`chore(scaffold):`, `docs(release):`), so every one of them landed in the
    # published changelog anyway. That is the "leaking commits" number the
    # release notes in claudedocs/ have re-derived BY HAND for three releases
    # running (v0.1.93, v0.1.94, v0.1.95) without anyone tracing it to the
    # regex. Confirmed against v0.1.95's generated body, which carries both
    # `chore(scaffold): bump @civitai/* pins` and `docs(release): v0.1.94
    # shipped`. Verify a change here on the NEXT release's body — a filter that
    # matches nothing looks identical to a filter with nothing to match.
    exclude:
      - "^docs(\\(.*\\))?:"
      - "^test(\\(.*\\))?:"
      - "^chore(\\(.*\\))?:"

# Homebrew tap (cask). goreleaser v2 replaced `brews:` with `homebrew_casks:`.
# ENABLED 2026-06-24: `civitai/homebrew-tap` is PUBLIC (audited clean) and the
# HOMEBREW_TAP_GITHUB_TOKEN repo secret (write to the tap) is set.
#
# 🔴 GORELEASER RENDERS THE CASK AND MUST NEVER PUSH IT — see `skip_upload`.
homebrew_casks:
  - name: civitai
    # THE TAP PUSH DOES NOT BELONG TO THE TAG-TIME RUN, BECAUSE `release.draft`
    # BELOW IS TRUE. Until 2026-08-09 this run pushed the cask at the same moment
    # it created the DRAFT release, so the cask named a version whose archives
    # 404 for everybody. Measured, v0.1.91 tagged 01:09Z and still a draft hours
    # later: the cask said `version "0.1.91"` while
    # `.../download/v0.1.91/civitai_0.1.91_linux_amd64.tar.gz` answered 404 and
    # the v0.1.90 archive answered 200. `brew install civitai/tap/civitai` was
    # broken for ~2 hours. npm was unaffected because `release-npm.yml` waits for
    # `release: published`; `.github/workflows/release-homebrew.yml` now makes
    # the Homebrew channel wait for the same event.
    #
    # 🔴 THIS IS `true`, NOT `"auto"`, AND "auto" WOULD NOT HAVE HELPED.
    # Verified in goreleaser's source (v2.17.1, internal/pipe/cask/cask.go,
    # doPublish): "auto" skips only when `ctx.Semver.Prerelease != ""`. It does
    # not consult `release.draft` at all — no reference to it exists in that
    # pipe — so "auto" would have pushed the cask on 2026-08-09 exactly as the
    # unset default did.
    #
    # 🔴 THE CASK IS STILL RENDERED. `skip_upload` is read in doPublish only;
    # doRun writes `dist/homebrew/Casks/civitai.rb` regardless (goreleaser's own
    # comment in publishAll: "this is needed so we actually create the
    # `dist/foo.rb` file"). release.yml attaches that file to the release, and
    # release-homebrew.yml pushes those exact bytes once the release is
    # published. Do not "fix" this by deleting the line: that restores the
    # outage. Do not "fix" it by re-rendering the cask later either — the builds
    # are not reproducible (`-X main.date={{ .Date }}`), so a second render
    # produces different sha256 values than the archives that were uploaded.
    skip_upload: true
    # Pin the cask to the tar.gz archive only. Without this, the added
    # `civitai-raw` (bare binary) archive gives two archives per OS/Arch and
    # goreleaser errors ("one tap can handle only one archive of an OS/Arch
    # combination"). This keeps Homebrew's output identical to before the raw
    # archive was added.
    ids:
      - civitai
    binaries:
      - civitai
    repository:
      owner: civitai
      name: homebrew-tap
      # 🔴 THIS TEMPLATE IS DELIBERATELY DANGLING, AND MUST STAY THAT WAY.
      # #319 removed HOMEBREW_TAP_GITHUB_TOKEN from release.yml's goreleaser
      # step, so the variable is NOT set when this config is read. That is
      # inert, not broken: `skip_upload: true` above makes doPublish return on
      # its first statement, and the render path (doRun → client.TemplateRef)
      # copies `token` through UNTEMPLATED — the only code that resolves it is
      # client.NewIfToken, reached from doPublish AFTER the skip. Verified in
      # goreleaser v2.17.1 source, not inferred from a green snapshot: a
      # snapshot run skips publishing entirely and so cannot tell the two
      # apart.
      #
      # The line stays because it names the credential the tap push actually
      # uses — `release-homebrew.yml` reads the same secret directly — and
      # because it is the tripwire: anyone deleting `skip_upload` (which
      # restores the 2026-08-09 outage) gets a loud template error on the next
      # release instead of a silent fallback to this repo's GITHUB_TOKEN, which
      # has no write access to civitai/homebrew-tap.
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/civitai/cli"
    description: "Civitai CLI — author and ship Apps"
    commit_author:
      name: civitai-bot
      email: bot@civitai.com
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/civitai"]
          end

release:
  # Publishing this draft is what releases the CLI on BOTH downstream channels:
  # `release-npm.yml` publishes `@civitai/cli` and `release-homebrew.yml` pushes
  # the Homebrew cask, both on `release: types: [published]`. Nothing downstream
  # of this file may act on a tag alone.
  draft: true
  footer: |
    ## Install

    ```bash
    # npm (Node) — downloads + sha256-verifies the matching binary on install
    npm install -g @civitai/cli        # or: npx @civitai/cli
    # Homebrew (macOS / Linux)
    brew install civitai/tap/civitai
    # Go (from source)
    go install github.com/civitai/cli/cmd/civitai@latest
    ```

    Or grab a prebuilt binary from the assets below and verify it against `checksums.txt`.
