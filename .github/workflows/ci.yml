name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger — the recovery path when GitHub drops a run.
  #
  # On 2026-08-06 an Actions incident throttled webhook triggers: push and
  # pull_request events stopped creating workflow runs entirely (GitHub-managed
  # workflows like CodeQL kept firing, so events WERE arriving — only user
  # workflow runs went missing). PR #219 sat unmergeable for hours with no way
  # to re-run anything: `gh run rerun` needs an existing run for the head sha,
  # and empty commits and a close/reopen both produced nothing, because the
  # trigger they rely on was the throttled thing.
  #
  # workflow_dispatch is the only trigger that does not depend on a webhook.
  # It cannot be back-applied — a dispatchable workflow must already exist on
  # the default branch — so it is only useful if it lands BEFORE the next
  # incident. Do not remove it because it looks unused.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-ed:"
            echo "$unformatted"
            exit 1
          fi

      - name: test
        run: go test ./...

      - name: build
        run: go build ./...

  # Static-analysis gate: golangci-lint over the whole module using the curated
  # linter set in .golangci.yml (staticcheck / govet / ineffassign / unused /
  # misspell + gofmt). Runs on every PR. `make lint` mirrors this locally.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false # golangci-lint-action manages its own build/analysis cache

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

  # Drift-guard: the vendored block-manifest schema (go:embed'd for offline
  # `civitai app validate`) must stay identical to the canonical the platform
  # publishes at civitai.com/schemas/app-block/v1.json (the single source of
  # truth). Fails if a server-side contract change leaves the CLI stale.
  schema-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check canonical schema
        run: ./scripts/check-canonical-schema.sh

  # Rot-guard: assert each scaffold template's `@civitai/*` pin still ADMITS the
  # version npm currently publishes as `latest`. A pre-1.0 caret (`^0.24.0`)
  # locks the minor, so a pin that falls behind npm silently ships apps that are
  # born stale — and `npm install` won't catch it (it resolves the caret to the
  # newest version the stale range still admits). This is the network half of
  # the scaffold guard; it's env-gated so the default `go test ./...` stays
  # offline, and it SKIPS (never false-fails) when npm is unreachable.
  pins-vs-published:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: check scaffold pins vs npm latest
        env:
          CIVITAI_CHECK_PUBLISHED_PINS: "1"
        run: go test ./internal/scaffold -run TestScaffoldPinsSatisfyPublished -v

  # Guard B for the block->host ready-ack (issue #206) — the RUNTIME half.
  #
  # `internal/scaffold/ready_ack_contract_test.go` runs in the build-test job
  # above and proves each SDK-free page template ships a byte-identical copy of
  # `internal/blockproto/ready-ack.js` that the entry point RESOLVES to. It
  # cannot prove the ack FIRES — no Go static check can prove JavaScript
  # executes, and an emitter with an inverted `event.source` check passes every
  # static assertion while being completely inert.
  #
  # This job executes the emitter in node against a fake host. It is env-gated
  # so `make ci` stays Go-only and offline. The daily `bump-scaffold-pins` sweep
  # runs it too, but a daily runner reports up to 24h AFTER a merge, on a
  # workflow nobody watches — running it per-PR puts the result in front of a
  # reviewer while the change is still open.
  #
  # 🔴 NOTE: this both reports AND gates. `main`'s required contexts are
  # `pins-vs-published`, `scaffold-currency`, `build-test`, `ready-ack-runtime`
  # and `template-page-vite` (no rulesets), so a red run here blocks the merge.
  # That was a policy change made after this job landed — it did NOT gate when
  # it shipped. Re-measure with
  # `gh api repos/civitai/cli/branches/main/protection` before calling any job
  # here a gate; see AGENTS.md item 11.
  #
  # -v so the run REPORTS its controls (an inert emitter and a naive ack are
  # driven through the same assertions and must be rejected) rather than just an
  # exit code.
  ready-ack-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: scaffolded ready-ack actually fires
        env:
          CIVITAI_CHECK_SCAFFOLD_RUNTIME: "1"
        run: go test ./internal/scaffold -run TestScaffoldedReadyAckActuallyFires -count=1 -v

  # Rot-guard: build the page-vite template. It is the only SDK-free template
  # with a build step, and nothing else in CI builds it — `template-page-money`
  # and `scaffold-currency` both scaffold page-money.
  #
  # Since #206 its entry module has a HARD RESOLUTION DEPENDENCY on
  # `./civitai-host.js`, so a wrong import path is a build failure rather than a
  # subtle one. Measured: `import '../nonexistent/civitai-host.js'` survived the
  # entire Go suite, and would have shipped a template that cannot build at all.
  #
  # The bundle assertion is separate from Guard A on purpose. Guard A pins the
  # SOURCE tree; Vite output is what the platform actually serves, and a
  # tree-shaken or mis-externalised side-effect import would leave a bundle with
  # no handshake in it. Control pair, both measured locally: with the import the
  # bundle carries BLOCK_INIT/BLOCK_READY, with it commented out it carries
  # neither — while the positive control (the app's display name) matches in
  # both cases, proving the grep reads the bundle either way.
  template-page-vite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: scaffold page-vite
        run: go run ./cmd/civitai app init "CI Vite Block" --dir ./_ci-page-vite --template page-vite

      - name: install
        working-directory: ./_ci-page-vite
        run: npm install --no-audit --no-fund

      - name: build
        working-directory: ./_ci-page-vite
        run: npm run build

      - name: the ready-ack survives bundling
        working-directory: ./_ci-page-vite
        run: |
          set -euo pipefail

          # Every grep below is `|| true`. Without it this whole step is a trap:
          # grep exits 1 on NO MATCH, pipefail propagates that through the pipe,
          # and `set -e` kills the step AT THE ASSIGNMENT — so the count line and
          # the ::error:: annotation never print. Measured: the step exited 1
          # having printed only the positive-control line, which is precisely the
          # ambiguity the positive control exists to remove ("is the harness not
          # reading the bundle, or did the ack not survive the build?").
          # It failed CLOSED, so this was a diagnosis bug, not a safety one.

          # The exact JS files under test, captured once and reused, so the
          # assertions cannot be satisfied by dist/index.html or a public/
          # passthrough that never goes through the bundler.
          mapfile -t js < <(find dist -name '*.js' -type f | sort)
          echo "JS files emitted into dist/: ${#js[@]}"
          printf '  %s\n' "${js[@]}"
          if [ "${#js[@]}" -lt 1 ]; then
            echo "::error::the build emitted no JS into dist/ — nothing to check, so a pass here would be meaningless"
            exit 1
          fi

          # POSITIVE CONTROL for the grep itself, FIRST: a string that must be in
          # the bundle whatever the handshake does. If this misses, the path or
          # the pattern is wrong and the two assertions below prove nothing.
          control=$(grep -lF 'CI Vite Block' "${js[@]}" | wc -l || true)
          echo "positive control (app display name): $control file(s)"
          if [ "$control" -lt 1 ]; then
            echo "::error::positive control failed — this step is not reading the built bundle, so its verdict on the ready-ack means nothing"
            exit 1
          fi

          rc=0
          for needle in BLOCK_INIT BLOCK_READY; do
            n=$(grep -lF "$needle" "${js[@]}" | wc -l || true)
            echo "$needle: $n file(s)"
            if [ "$n" -lt 1 ]; then
              echo "::error::$needle is absent from the built bundle — the ready-ack did not survive the build, so the shipped app never says hello (issue #206)"
              rc=1
            fi
          done
          exit "$rc"

      - name: validate
        working-directory: ./_ci-page-vite
        run: go run ../cmd/civitai app validate

  # Rot-guard: scaffold the page-money template and run its JS toolchain against
  # the PUBLISHED SDK (@civitai/blocks-react). Catches a template that renders
  # but no longer installs / typechecks / tests / builds after an SDK bump — the
  # out-of-the-box contract the template promises.
  template-page-money:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: scaffold page-money
        run: go run ./cmd/civitai app init "CI Money Block" --dir ./_ci-page-money --template page-money

      - name: install
        working-directory: ./_ci-page-money
        run: npm install --no-audit --no-fund

      - name: typecheck
        working-directory: ./_ci-page-money
        run: npm run typecheck

      - name: test (node + dom suites)
        working-directory: ./_ci-page-money
        run: npm test

      - name: build
        working-directory: ./_ci-page-money
        run: npm run build

      - name: validate
        working-directory: ./_ci-page-money
        run: go run ../cmd/civitai app validate

  # Scaffold-currency guard — the "born-broken app" gate. Two rot-classes that
  # pins-vs-published + template-page-money both MISS:
  #
  #   (a) ANTI-PATTERN gate — scaffold the SDK template, then scan the generated
  #       source for a curated denylist of dead/superseded platform surfaces
  #       (the REMOVED /api/v1/blocks/buzz route, the superseded shared-storage
  #       REST route, the deprecated @civitai/blocks-cli). A scaffold can compile
  #       and pass the pins guard yet still fetch a route that 404s at runtime —
  #       exactly how playable-collections shipped 3 broken features. The denylist
  #       is precise: it does NOT flag legitimately-REST unbridged endpoints
  #       (catalog /models, /images; the /me viewer read; the /dev-token mint).
  #       Logic + fixtures live in internal/antipattern (offline table test); this
  #       runs it against the real `civitai app init` output.
  #
  #   (b) LATEST-SDK build — install the ACTUAL newest published @civitai/app-sdk
  #       + @civitai/blocks-react (not the pinned caret npm resolves to) and
  #       re-typecheck + re-build. pins-vs-published catches "the pin can't admit
  #       latest"; THIS catches "the template code breaks against latest" (a
  #       removed/renamed SDK export). Network-dependent, so it mirrors the
  #       pins-vs-published SKIP-on-unreachable contract: a reachability PROBE
  #       gates the install/typecheck/build steps — an npm outage (network / DNS /
  #       5xx / 429) SKIPS them (job stays green, indistinguishable-from-real is
  #       avoided) while a reachable registry runs them and FAILS on a genuine
  #       code-breaks-against-latest signal. (A peer-dep incompat where the pin
  #       can't admit latest is already caught by pins-vs-published, so treating an
  #       install failure under a REACHABLE registry as real is correct.) The
  #       offline anti-pattern scan is hermetic and always runs.
  scaffold-currency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: scaffold page-money
        run: go run ./cmd/civitai app init "CI Currency Block" --dir "$GITHUB_WORKSPACE/_ci-currency" --template page-money

      # (a) Anti-pattern gate on the scaffolded app.
      #     CIVITAI_ANTIPATTERN_SCAN_DIR MUST be ABSOLUTE: `go test` runs the test
      #     binary with its CWD set to the package dir (internal/antipattern), not
      #     the repo root, so a relative `./_ci-currency` would resolve under the
      #     package dir and lstat-fail. github.workspace anchors it to where the
      #     scaffold step wrote the app.
      - name: anti-pattern scan (scaffolded app)
        env:
          CIVITAI_ANTIPATTERN_SCAN_DIR: ${{ github.workspace }}/_ci-currency
        run: go test ./internal/antipattern -run TestScanDirFromEnv -count=1 -v

      # (b) Build against the LATEST published SDK, not just the pinned caret.
      #     Probe npm first; if the registry is unreachable (network/DNS/5xx/429)
      #     the build steps SKIP so a transient outage can't red the job (mirrors
      #     the pins-vs-published skip-on-unreachable contract). A 200 on the
      #     /latest metadata means "reachable" — a real SDK break then fails at
      #     typecheck/build, not here.
      - name: probe npm reachability
        id: npmprobe
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 \
            https://registry.npmjs.org/@civitai/app-sdk/latest 2>/dev/null) || code=000
          [ -z "$code" ] && code=000
          if [ "$code" = "200" ]; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
            echo "npm registry reachable (HTTP $code) — running the latest-SDK build check"
          else
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=scaffold-currency::skipped latest-SDK build check — npm registry unreachable (HTTP $code); not a real failure, re-run later"
          fi

      - name: install (pinned)
        if: steps.npmprobe.outputs.reachable == 'true'
        working-directory: ./_ci-currency
        run: npm install --no-audit --no-fund

      - name: install @latest SDK
        if: steps.npmprobe.outputs.reachable == 'true'
        working-directory: ./_ci-currency
        run: npm install --no-audit --no-fund @civitai/app-sdk@latest @civitai/blocks-react@latest

      - name: typecheck against latest SDK
        if: steps.npmprobe.outputs.reachable == 'true'
        working-directory: ./_ci-currency
        run: npm run typecheck

      - name: build against latest SDK
        if: steps.npmprobe.outputs.reachable == 'true'
        working-directory: ./_ci-currency
        run: npm run build
