name: flake

# Builds the Nix flake so a stale vendorHash (or a flake that no longer
# evaluates/builds) fails CI instead of silently shipping a broken
# `nix run github:civitai/cli`. vendorHash drifts whenever go.mod/go.sum change,
# so this runs on those + the flake files. To fix a failure: set vendorHash to
# lib.fakeHash in flake.nix, run `nix build`, and copy the `got:` value.
on:
  pull_request:
    paths:
      - go.mod
      - go.sum
      - flake.nix
      - flake.lock
      - .github/workflows/flake.yml
  push:
    branches: [main]
    paths:
      - go.mod
      - go.sum
      - flake.nix
      - flake.lock
  workflow_dispatch:

# One group per ref (same pattern as civitai/civitai#6718 / #6728, for runner
# savings): a newer push to a PR, or to `main`, cancels the in-flight run for
# the older commit; a `nix build` per superseded commit is pure queue time.
# A dispatch gets its own `dispatch-` group so it neither cancels nor is cancelled by a push run.
# Not a required status check, and nothing consumes its per-commit verdict.
concurrency:
  group: flake-${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.ref) || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: nix build .#default (validates vendorHash + build)
        run: nix build .#default
      - name: run the built binary
        run: ./result/bin/civitai version
