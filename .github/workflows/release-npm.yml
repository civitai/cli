name: Release npm
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (no leading v), e.g. 0.1.40"
        required: true
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    # OIDC trusted publishing: no NPM_TOKEN secret. The runner presents a
    # short-lived OIDC token to npm; npm verifies it against the trusted
    # publisher configured on the @civitai/cli package (repo civitai/cli +
    # this workflow file). id-token:write is what mints that token.
    permissions:
      contents: read
      id-token: write # required for OIDC trusted publishing (+ provenance)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Ensure npm supports OIDC trusted publishing (>= 11.5.1)
        # The npm bundled with Node 22 (npm 10.x) predates OIDC trusted
        # publishing. npm auto-detects the OIDC env and uses it before any
        # token, but only on 11.5.1+, so we install a newer npm.
        # PIN the version — do NOT use npm@latest: on 2026-07-09 a floating
        # latest regressed `npm publish --provenance` with
        # "Cannot find module 'sigstore'" and failed the v0.1.59 publish.
        # 11.18.0 is the version that successfully published v0.1.58.
        run: |
          npm install -g npm@11.18.0
          npm --version
      - name: Resolve version
        id: v
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            V="$INPUT_VERSION"
          else
            V="${RELEASE_TAG#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Assert release carries the raw-binary assets
        # Guards against publishing an npm version that points at a release with
        # no `civitai-raw` bare binary (e.g. any pre-#85 tag, or a bad manual
        # dispatch) — that would be a package that 404s on postinstall forever.
        # Cheap correctness check; runs for both triggers.
        env:
          VERSION: ${{ steps.v.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          assets="$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name')" || {
            echo "::error::GitHub release v$VERSION not found (or not readable)."
            exit 1
          }
          if ! printf '%s\n' "$assets" | grep -qx "civitai_${VERSION}_linux_amd64"; then
            echo "::error::Release v$VERSION is missing the raw binary asset civitai_${VERSION}_linux_amd64. Refusing to publish a package that would 404 on postinstall."
            printf 'assets present:\n%s\n' "$assets"
            exit 1
          fi
          if ! printf '%s\n' "$assets" | grep -qx "checksums.txt"; then
            echo "::error::Release v$VERSION is missing checksums.txt. Refusing to publish."
            exit 1
          fi
          echo "Release v$VERSION carries civitai-raw assets + checksums.txt — OK."
      - name: Stamp version + license
        working-directory: ./npm
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          cp ../LICENSE ./LICENSE
      - name: Skip if already published (idempotent)
        id: pub
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if npm view "@civitai/cli@$VERSION" version >/dev/null 2>&1; then
            echo "Already on npm; skipping."; echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        if: steps.pub.outputs.skip == 'false'
        working-directory: ./npm
        # No NODE_AUTH_TOKEN: npm authenticates via OIDC. `--access public`
        # keeps the scoped @civitai/cli package public. `--provenance` is kept
        # explicit — docs say provenance is automatic under trusted publishing,
        # but practitioners report it is not always emitted without the flag;
        # passing it is idempotent and guarantees the attestation.
        run: npm publish --provenance --access public
