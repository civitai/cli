name: Release npm
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (no leading v), e.g. 0.1.40"
        required: true
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    # OIDC trusted publishing: no NPM_TOKEN secret. The runner presents a
    # short-lived OIDC token to npm; npm verifies it against the trusted
    # publisher configured on the @civitai/cli package (repo civitai/cli +
    # this workflow file). id-token:write is what mints that token.
    #
    # 🔴 THE TRUSTED PUBLISHER IS PER PACKAGE, AND OIDC CANNOT CREATE ONE. Every
    # platform package in npm/lib/platforms.json is its own npm package: before
    # the first release that lists it, an npm org member has to publish that
    # name once by hand and add the same trusted publisher to it. Skip either
    # and "Publish platform packages" below fails — which stops the job before
    # the main package is published, so that release ships NO npm version until
    # it is fixed and this workflow is re-run (workflow_dispatch, same version;
    # every publish here skips what is already on npm).
    permissions:
      contents: read
      id-token: write # required for OIDC trusted publishing (+ provenance)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Ensure npm supports OIDC trusted publishing (>= 11.5.1)
        # The npm bundled with Node 22 (npm 10.x) predates OIDC trusted
        # publishing. npm auto-detects the OIDC env and uses it before any
        # token, but only on 11.5.1+, so we install a newer npm.
        # PIN the version — do NOT use npm@latest: on 2026-07-09 a floating
        # latest regressed `npm publish --provenance` with
        # "Cannot find module 'sigstore'" and failed the v0.1.59 publish.
        # 11.18.0 is the version that successfully published v0.1.58.
        run: |
          npm install -g npm@11.18.0
          npm --version
      - name: Resolve version
        id: v
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            V="$INPUT_VERSION"
          else
            V="${RELEASE_TAG#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Assert release carries the raw-binary assets
        # Guards against publishing an npm version that points at a release with
        # no `civitai-raw` bare binary (e.g. any pre-#85 tag, or a bad manual
        # dispatch) — that would be a package that 404s on postinstall forever.
        # Cheap correctness check; runs for both triggers.
        env:
          VERSION: ${{ steps.v.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          assets="$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name')" || {
            echo "::error::GitHub release v$VERSION not found (or not readable)."
            exit 1
          }
          if ! printf '%s\n' "$assets" | grep -qx "civitai_${VERSION}_linux_amd64"; then
            echo "::error::Release v$VERSION is missing the raw binary asset civitai_${VERSION}_linux_amd64. Refusing to publish a package that would 404 on postinstall."
            printf 'assets present:\n%s\n' "$assets"
            exit 1
          fi
          if ! printf '%s\n' "$assets" | grep -qx "checksums.txt"; then
            echo "::error::Release v$VERSION is missing checksums.txt. Refusing to publish."
            exit 1
          fi
          echo "Release v$VERSION carries civitai-raw assets + checksums.txt — OK."
      - name: Stamp version + license
        working-directory: ./npm
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          # Pin every platform package (optionalDependencies) to this exact
          # version — the main package must only ever name a platform package
          # version published by this same run.
          node scripts/release.js pin "$VERSION"
          cp ../LICENSE ./LICENSE
      - name: Publish platform packages
        # The platform packages (npm/lib/platforms.json) carry the binary
        # itself, so `npm install @civitai/cli` needs nothing but the npm
        # registry. Each one is the release's raw-binary asset, verified against
        # checksums.txt, wrapped in a package.json by scripts/release.js.
        #
        # 🔴 THIS STEP MUST STAY BEFORE "Publish" AND MUST BE ALLOWED TO FAIL THE
        # JOB. The main package pins these at the same version; published first
        # it would name a version that does not exist. npm tolerates a missing
        # OPTIONAL dependency, so nothing would error — every install would
        # silently fall back to the GitHub download this exists to avoid.
        # No `continue-on-error`, no `|| true` on the publish.
        env:
          VERSION: ${{ steps.v.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/platform-packages"
          mkdir -p "$work"
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" \
            --pattern checksums.txt --dir "$work"

          node npm/scripts/release.js platforms "$VERSION" > "$work/platforms.tsv"
          # Positive control: an empty list would publish nothing and pass.
          if [ ! -s "$work/platforms.tsv" ]; then
            echo "::error::npm/scripts/release.js listed no platform packages."
            exit 1
          fi

          # fd 3, not stdin: gh and npm must not be able to eat the list.
          while IFS=$'\t' read -r -u 3 pkg asset; do
            if npm view "$pkg@$VERSION" version >/dev/null 2>&1; then
              echo "$pkg@$VERSION already on npm; skipping."
              continue
            fi
            gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" \
              --pattern "$asset" --dir "$work"
            awk -v a="$asset" '$2 == a' "$work/checksums.txt" > "$work/$asset.sha256"
            if [ ! -s "$work/$asset.sha256" ]; then
              echo "::error::checksums.txt for v$VERSION has no entry for $asset."
              exit 1
            fi
            (cd "$work" && sha256sum --check --strict "$asset.sha256")
            out="$work/pkg-$asset"
            node npm/scripts/release.js build-platform "$VERSION" "$pkg" "$work/$asset" "$out"
            (cd "$out" && npm publish --provenance --access public)
          done 3< "$work/platforms.tsv"
      - name: Skip if already published (idempotent)
        id: pub
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if npm view "@civitai/cli@$VERSION" version >/dev/null 2>&1; then
            echo "Already on npm; skipping."; echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        if: steps.pub.outputs.skip == 'false'
        working-directory: ./npm
        # No NODE_AUTH_TOKEN: npm authenticates via OIDC. `--access public`
        # keeps the scoped @civitai/cli package public. `--provenance` is kept
        # explicit — docs say provenance is automatic under trusted publishing,
        # but practitioners report it is not always emitted without the flag;
        # passing it is idempotent and guarantees the attestation.
        run: npm publish --provenance --access public
