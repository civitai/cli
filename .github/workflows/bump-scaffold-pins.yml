# Auto-bump the scaffold's @civitai/* pins when they fall behind npm.
#
# The page-money template pins @civitai/app-sdk and @civitai/blocks-react with
# pre-1.0 carets that LOCK THE MINOR, so every new minor those packages publish
# turns the `pins-vs-published` guard red until a human hand-bumps the pins in
# three places. This job runs `bump-pins` (which rewrites the literals in the
# template + README + the scaffold_test.go canary), validates the result IN THIS
# JOB, and opens a PR when anything changed — so the hand-fix never recurs.
#
# 🔴 "OPENS A PR WHEN ANYTHING CHANGED" IS THE WHOLE POINT, AND IT USED TO BE
# FALSE. Until #530 the PR step required every validation to have passed, so one
# failing check — an npm-side crash, not an SDK break — meant the pins were never
# proposed at all and `pins-vs-published` (REQUIRED, `enforce_admins: true`)
# stayed red on `main`, blocking every open PR for three days. Now: a failed
# `validate — scaffold builds against the bumped SDK` DOWNGRADES the PR to a
# DRAFT with a failure banner instead of suppressing it, while a failed pins or
# suite check still withholds it (those two mean the bumper itself produced
# something incoherent). The job still ends RED either way, so the issue is still
# filed. Read the `open PR if pins changed` step's comment before re-tightening
# any of it.
#
# A RED RUN OF THIS WORKFLOW NOW FILES ITS OWN ISSUE — see the `classify` and
# `signal` jobs. A failing SCHEDULED run notifies almost nobody (GitHub mails
# only whoever last edited the `cron` line, through that person's own per-user
# Actions setting), which is how `bump-flake-vendorhash.yml` failed every run
# for three weeks with nobody noticing (#316). This workflow was green
# throughout — so was that one, right up until it wasn't. The reporting
# mechanism is the shared `failure-issue.yml`; read its header for the anti-spam
# rules it enforces (one open issue, a repeat failure rewrites the body rather
# than commenting, a green run closes the issue).
#
# BOTH jobs below report, and that is the point: `ready-ack-runtime` is an
# independent drift alarm on `main` that could go red on its own for weeks
# without `bump` noticing, or vice versa. `classify` is where the two verdicts
# are combined into the one message `failure-issue.yml` files.
#
# ERREXIT NOTE, because this is the trap that caused #316 and #313. GitHub runs
# every `run:` block as `bash -e {0}`, so errexit is ON before the first line and
# `set -uo pipefail` does NOT clear it. Audited: NO step in this workflow runs a
# command that is expected to fail as part of its logic — every `go`, `npm`,
# `gh` and `git` invocation here is expected to succeed (the `gh pr ready` call
# is guarded by an `isDraft` read precisely because calling it on an already-ready
# PR WOULD be a command expected to fail), and the one deliberate failure
# (the fire drill) exits explicitly rather than leaning on the shell. So errexit
# is welcome here. If you add a command that IS expected to fail, handle its
# status where you write it; do not leave it to the shell.
name: bump-scaffold-pins

on:
  schedule:
    # DAILY at 07:17 UTC (off the top-of-hour rush; the minute is offset from the
    # sibling drift-bots — revendor-canonical-schema :37 every 6h,
    # bump-flake-vendorhash 07:47). Cron literal in YAML needs quoting so the `*`
    # isn't parsed as a YAML alias.
    #
    # This was weekly (`17 7 * * 1`) and that cadence was measurably too slow.
    # `pins-vs-published` is a REQUIRED check on `main` and it reads npm's
    # published latest, so from the moment a `@civitai/*` minor lands until this
    # job bumps the pins, EVERY open PR is blocked regardless of its content.
    # (The sibling `scaffold-currency` is required too but is NOT affected: it
    # installs `@latest` explicitly, overriding the template pins, so it reds on
    # a broken SDK export rather than on a stale caret.)
    #
    # Publishes measured off the npm registry `time` field: app-sdk 0.26.0
    # Jul 17, 0.27.0 Jul 28, 0.28.0 Jul 29, 0.29.0 Aug 3 20:15, 0.30.0 Aug 3
    # 22:13, 0.31.0 Aug 5 03:54 (2026) — six minors in 19 days, a ~3.6-day mean
    # interval against a 7-day sweep. Upstream published faster than the bot
    # swept, so a large fraction of each week sat red and the pins had to be
    # hand-bumped twice in two days (#194, #203).
    #
    # Daily bounds that window at ~24h instead of ~168h. A no-op run is cheap:
    # `detect changes` gates every downstream step, so an already-current sweep
    # is just checkout + setup-go + the bumper's npm metadata reads.
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      drill:
        description: "Fire drill: fail one or both jobs on purpose so the FAILURE path and the issue it files can be rehearsed. Opens a REAL issue — close it when you are done. It cannot open a PR or rewrite a pin: the drill fails at the bumper step, which is upstream of every step that writes anything."
        type: choice
        default: none
        options:
          - none
          - bump
          - ready-ack
          - both

permissions:
  contents: write
  pull-requests: write

jobs:
  # Runtime half of the ready-ack contract (issue #206). The offline guard in
  # `internal/scaffold/ready_ack_contract_test.go` proves each SDK-free page
  # template ships a byte-identical copy of `internal/blockproto/ready-ack.js`
  # and that the entry point loads it — it CANNOT prove the ack fires, because
  # no Go static check can prove JavaScript executes. This job runs the emitter
  # in node against a fake host and asserts a single correctly-addressed
  # `{type:'BLOCK_READY',payload:{height:0}}` goes out.
  #
  # 🔴 This is the DRIFT runner, NOT the gate. The gate is the identically-named
  # job in ci.yml, which runs on every pull request. A daily job cannot block a
  # merge — a regression would land green and surface up to 24h later, on a
  # workflow with no dependent job — so this copy alone would be a guard that
  # gates nothing. It exists to catch drift on `main` between PRs (a merged-tree
  # interaction, a node bump, an npm-side change), and is deliberately
  # independent of the `bump` job below so it runs on every sweep, including the
  # usual no-op ones where the pins are already current.
  #
  # "Surface up to 24h later" was itself optimistic until now: nothing read this
  # job's colour. It reports through `classify` → `signal` below.
  ready-ack-runtime:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      # 🔴 node 24 — KEEP IT ALIGNED WITH `ci.yml`, and do not drop back to 22.
      # The reason is stated in full at ci.yml's four `node-version: "24"` sites
      # (npm 10's arborist crashes with `Cannot read properties of null (reading
      # 'edgesOut')` while installing a scaffolded page-money app; npm 11
      # succeeds). Read one of them before changing this.
      #
      # It matters HERE, in a job that runs no npm install, for a second reason:
      # this is the daily DRIFT runner for the identically-named GATE job in
      # ci.yml. A drift runner on a different node major than the gate it mirrors
      # is a two-tier suite — the two tiers can disagree, and a failure visible in
      # one can be structurally invisible in the other, which is the exact shape
      # that let #530 sit for three days. Same major in both tiers, always.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # -v so the run REPORTS its controls (an inert emitter and a naive ack are
      # both driven through the same assertions and must be rejected) rather than
      # just an exit code.
      - name: scaffolded ready-ack actually fires
        id: readyack
        env:
          CIVITAI_CHECK_SCAFFOLD_RUNTIME: "1"
          DRILL: ${{ (github.event_name == 'workflow_dispatch' && inputs.drill) || 'none' }}
        run: |
          set -uo pipefail

          if [ "$DRILL" = "ready-ack" ] || [ "$DRILL" = "both" ]; then
            # Fire drill. Failing this step is the SAME input the classifier
            # reads on a real regression — there is no sub-verdict here to stub,
            # so the rehearsal drives the genuine path rather than a mock of it.
            echo "⚠️  FIRE DRILL — failing the ready-ack runtime check on purpose to rehearse the reporting path."
            echo "    No test was run and nothing on disk was touched."
            exit 1
          fi

          go test ./internal/scaffold -run TestScaffoldedReadyAckActuallyFires -count=1 -v 2>&1 \
            | tee "$RUNNER_TEMP/ready-ack.log"

          # POSITIVE CONTROL, and it is not decoration. `go test -run <name>`
          # exits 0 when the pattern matches NOTHING — it prints "testing:
          # warning: no tests to run" and "ok … [no tests to run]" — and this
          # test body additionally only runs behind the
          # CIVITAI_CHECK_SCAFFOLD_RUNTIME gate. So a renamed test, a moved
          # file, or a changed env-var name turns this whole job into a green
          # that checked nothing, and a check whose red can never be seen is
          # exactly what the reporting below is for. Require the test's own PASS
          # line, so this job's colour is a claim about the ack.
          if ! grep -q -- '--- PASS: TestScaffoldedReadyAckActuallyFires' "$RUNNER_TEMP/ready-ack.log"; then
            echo "::error::the ready-ack runtime check exited 0 without running TestScaffoldedReadyAckActuallyFires — the -run pattern matched no test (renamed? moved? CIVITAI_CHECK_SCAFFOLD_RUNTIME gate changed?). A green here would have been a claim about nothing."
            exit 1
          fi

  bump:
    runs-on: ubuntu-latest
    # Read by `classify` to describe WHICH phase went wrong. These are the raw
    # step outcomes, deliberately not prose: ALL the wording lives in one place
    # (`classify`), so the two jobs' verdicts cannot end up worded by two
    # different authors. Every one of these is EMPTY when the job died before
    # the step existed — which `classify` resolves to its own `bump-unknown`
    # state rather than borrowing a verdict it never reached.
    outputs:
      r_bump: ${{ steps.bump.outcome }}
      r_changed: ${{ steps.changed.outcome }}
      r_pins: ${{ steps.validate_pins.outcome }}
      r_suite: ${{ steps.validate_suite.outcome }}
      r_build: ${{ steps.validate_build.outcome }}
      r_pr: ${{ steps.pr.outcome }}
      r_ready: ${{ steps.pr_ready.outcome }}
      # The PR's URL, so `classify` can LINK the draft it tells a reader to go
      # review instead of asserting one exists. Empty when the step was skipped
      # or failed — `classify` branches on emptiness rather than assuming.
      pr_url: ${{ steps.pr.outputs.pull-request-url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: bump stale @civitai/* scaffold pins
        id: bump
        env:
          DRILL: ${{ (github.event_name == 'workflow_dispatch' && inputs.drill) || 'none' }}
        run: |
          set -u
          if [ "$DRILL" = "bump" ] || [ "$DRILL" = "both" ]; then
            # Fire drill, placed here on purpose: this step is upstream of
            # `detect changes` and of every step that writes anything, so a
            # drill can neither rewrite a pin nor open a PR.
            echo "⚠️  FIRE DRILL — failing the pin bumper on purpose to rehearse the reporting path."
            echo "    No npm lookup was made and no pin was rewritten."
            exit 1
          fi
          go run ./internal/scaffold/cmd/bump-pins

      # Only validate + open a PR when the bumper actually rewrote something — a
      # no-op run (pins already current) skips everything downstream.
      - name: detect changes
        id: changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "pins already current — nothing to do"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Prove correctness INSIDE this job. A PR opened below with the default
      # GITHUB_TOKEN does NOT trigger this repo's other workflows (GitHub's
      # loop-guard), so `pins-vs-published`/`scaffold-currency` will NOT auto-run
      # on the bump PR. Validate here instead: the network guard confirms the new
      # pins admit npm's published latest, and the offline suite confirms nothing
      # else regressed (incl. the scaffold_test.go pin assertions the bumper
      # rewrote).
      - name: validate — pins now satisfy published (network guard)
        id: validate_pins
        if: steps.changed.outputs.changed == 'true'
        env:
          CIVITAI_CHECK_PUBLISHED_PINS: "1"
        run: go test ./internal/scaffold -run TestScaffoldPinsSatisfyPublished -v

      - name: validate — full scaffold suite (offline)
        id: validate_suite
        if: steps.changed.outputs.changed == 'true'
        run: go test ./internal/scaffold/...

      # Prove the scaffolded app still BUILDS against the newly-pinned SDK — the
      # pins guard only proves the pin ADMITS the published minor, NOT that the
      # template code still compiles against it (a removed/renamed SDK export
      # would slip through otherwise, since this PR won't auto-run scaffold-
      # currency). Mirrors the template-page-money CI job. Scaffold into
      # RUNNER_TEMP so the generated app never pollutes the auto-PR diff.
      #
      # 🔴 THIS STEP FAILING NO LONGER SUPPRESSES THE PR — it downgrades it to a
      # DRAFT (see the `open PR if pins changed` step). It used to gate it, and
      # #530 is what that cost: an npm-side crash here meant the pins were never
      # proposed at all, so `pins-vs-published` (REQUIRED, `enforce_admins`)
      # stayed red on `main` and every open PR was blocked for three days until a
      # human bumped by hand. The job still ends RED when this step fails, so
      # `classify` → `signal` still file the issue.
      #
      # 🔴 node 24, NOT 22 — this line is what #530 actually was. `ci.yml` moved
      # to 24 in aebd2fb (PR #520) FOR THIS CRASH and this sibling was left
      # behind, so the nightly kept installing under node 22 / npm 10 and kept
      # dying with `Cannot read properties of null (reading 'edgesOut')`. The
      # full explanation lives at ci.yml's four `node-version: "24"` sites — read
      # one of them (e.g. the `template-page-money` job) before changing this.
      # Measured on the exact runner versions: node 22.23.2 / npm 10.9.8 fails
      # the unmodified page-money template at `npm install`, node 24.19.0 /
      # npm 11.17.0 installs, typechecks and builds it clean. Do not drop back
      # to 22. `workflow_node_version_test.go` fails if anyone does.
      - uses: actions/setup-node@v4
        if: steps.changed.outputs.changed == 'true'
        with:
          node-version: "24"

      - name: validate — scaffold builds against the bumped SDK
        id: validate_build
        if: steps.changed.outputs.changed == 'true'
        run: |
          go run ./cmd/civitai app init "Bump Validation" --dir "$RUNNER_TEMP/bump-validate" --template page-money
          cd "$RUNNER_TEMP/bump-validate"
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build

      # Compose the PR body HERE rather than inline in the action's `body:`,
      # because it has to be conditional and a GitHub expression cannot hold a
      # multi-paragraph markdown document without becoming unreadable.
      #
      # 🔴 The failure banner is the point. A draft PR whose body reads like a
      # routine bump is the "reads as fine" hazard: a reviewer sees green prose,
      # merges, and ships a scaffold that does not build. The banner goes FIRST,
      # before any of the normal explanation.
      #
      # Writes to $GITHUB_OUTPUT only — nothing lands in the workspace, so the
      # `add-paths` note below still holds. `body-path:` was rejected for exactly
      # that reason: a body file in the workspace would ride into the commit.
      - name: compose the PR title and body
        id: prbody
        if: always() && steps.changed.outputs.changed == 'true'
        env:
          R_BUILD: ${{ steps.validate_build.outcome }}
        run: |
          set -uo pipefail

          # The title carries the warning too: the PR LIST is the one surface a
          # reviewer sees before the body.
          if [ "$R_BUILD" = "success" ]; then
            title="chore(scaffold): bump @civitai/* pins to published latest"
          else
            title="DO NOT MERGE UNREVIEWED — @civitai/* pin bump validated except the scaffold build"
          fi

          {
            echo "title=$title"
            echo "body<<BUMP_PINS_BODY_EOF"
            if [ "$R_BUILD" != "success" ]; then
              cat <<'BANNER'
          > 🔴 **DO NOT MERGE THIS UNREVIEWED — IT IS A DRAFT ON PURPOSE.**
          >
          > The pin rewrite validated (npm admits the new pins, and the offline
          > scaffold suite is green), but the LAST check did not: a fresh
          > `civitai app init … --template page-money` at these pins failed to
          > install, typecheck or build. The bump is proposed anyway because
          > withholding it froze the repo for three days (#530) —
          > `pins-vs-published` is a REQUIRED check with `enforce_admins`, so
          > un-bumped pins block every open PR regardless of its content.
          >
          > **A human decides which failure this is.** Read the run log, then
          > this PR's own `template-page-money` / `scaffold-currency` checks —
          > they run on this PR (scoped token) and are the second opinion.
          > Mark it ready for review only once the build is understood.

          BANNER
            fi
            cat <<'BODY'
          Automated by the `bump-scaffold-pins` workflow (`internal/scaffold/cmd/bump-pins`).

          One or more `@civitai/*` packages published a new minor, so the
          page-money scaffold's pre-1.0 caret pins fell behind npm and the
          `pins-vs-published` guard would go red. This PR rewrites the literal
          pins in all three sites:

          - `internal/scaffold/templates/page-money/package.json.tmpl`
          - `internal/scaffold/templates/page-money/README.md.tmpl`
          - `internal/scaffold/scaffold_test.go` (the `mustContain` canary)

          The pins are rewritten as **literals** (not templated) on purpose:
          the guard reads the raw `^X.Y.Z` bytes out of the `.tmpl`, so
          templating the value would blind it.

          **CI note:** this PR is opened with a scoped fine-grained token
          (`secrets.BUMP_SCAFFOLD_PINS_TOKEN`, Contents + Pull requests RW on
          this repo only), not the default `GITHUB_TOKEN` — so the repo's
          normal checks (`pins-vs-published` / `scaffold-currency`) DO run on
          it. As defense-in-depth the bump job RUNS three checks before opening
          the PR — the network guard (`CIVITAI_CHECK_PUBLISHED_PINS=1 go test
          -run TestScaffoldPinsSatisfyPublished`), the full offline scaffold
          suite, and a fresh `civitai app init` scaffold that installs,
          typechecks and **builds** against the bumped SDK (which is what would
          catch a removed/renamed export).

          The first two must pass or this PR is not opened at all. The third
          does NOT block it — a failure there opens this PR as a **draft**
          instead, because withholding the bump freezes the whole repo (#530).
          Its result for this run is stated on the last line below; do not read
          "the bump job validates" as "everything passed".
          BODY
            echo
            echo "Scaffold build validation: \`$R_BUILD\`."
            echo "BUMP_PINS_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      # NO `add-paths:` here, deliberately — and that is a decision, not an
      # oversight. This action stages `git add -A` when `add-paths` is absent,
      # so ANY file a step leaves in the workspace rides into the PR. That is
      # exactly how the sibling `bump-flake-vendorhash` committed a `result`
      # symlink into /nix/store (#450, green on all 13 checks); it now pins
      # `add-paths: flake.nix`.
      #
      # This job was audited against that failure and does not have it: the only
      # step that writes into the repo is the bumper, and `bump-pins` writes
      # exclusively under its `--dir` (default `internal/scaffold`) to three
      # constant sites. Everything else writes outside the tree — `go test`
      # writes nothing, and `validate — scaffold builds` scaffolds and runs npm
      # in `$RUNNER_TEMP` on purpose (see that step's comment). Measured, not
      # just read: `git status --porcelain` is clean of artifacts after the test
      # suite and after a `civitai app init --dir "$RUNNER_TEMP/…"`.
      #
      # 🔴 If you add a step that builds/installs/generates INTO the workspace,
      # add `add-paths` naming the complete set of files this bot may commit —
      # `internal/scaffold` is the bumper's provable write root. Note the
      # trade-off before reaching for it as a reflex: a path that is written but
      # NOT listed is silently dropped from the commit, and a bot that opens an
      # incomplete PR is worse than the artifact the filter prevents.
      #
      # 🔴 `always()` HERE, AND WHY THE FIRE DRILL STILL CANNOT REACH THIS STEP.
      # `always()` only defeats the implicit `success()` that a step's `if:`
      # carries by default; the `changed == 'true'` conjunct is untouched and is
      # what the drill trips. `drill=bump` fails the `bump` step, so `detect
      # changes` (which has no `if:`, so it defaults to `success()`) is SKIPPED
      # and never writes its output — `steps.changed.outputs.changed` is then the
      # empty string, not `'true'`, and this step is skipped. The drill's own
      # description under `workflow_dispatch` still holds; it is pinned by
      # `TestBumpPRStepStillRequiresChangedOutput` in
      # `workflow_node_version_test.go`, which also fails if this condition ever
      # grows an `||`.
      #
      # A pins/suite failure still WITHHOLDS the PR — those two mean the bumper
      # produced something incoherent, so there is nothing worth proposing. Only
      # `validate_build` downgrades rather than blocks: its failure can be
      # upstream of us entirely (#530 was npm's arborist, not the SDK).
      - name: open PR if pins changed
        id: pr
        if: >-
          always()
          && steps.changed.outputs.changed == 'true'
          && steps.validate_pins.outcome == 'success'
          && steps.validate_suite.outcome == 'success'
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          # Scoped fine-grained token (Contents + Pull requests: RW on this repo
          # only). The civitai org disallows the default GITHUB_TOKEN from
          # creating PRs, and — bonus — a PR opened with this token DOES trigger
          # the repo's normal CI (which a GITHUB_TOKEN PR would not).
          token: ${{ secrets.BUMP_SCAFFOLD_PINS_TOKEN }}
          branch: automation/bump-scaffold-pins
          delete-branch: true
          commit-message: "chore(scaffold): bump @civitai/* pins to published latest"
          # Title and body are both composed by the `compose the PR title and
          # body` step —
          # they are conditional, and a `${{ a && 'x' || 'y' }}` ternary holding
          # a title with a colon in it does not survive YAML parsing unquoted.
          title: ${{ steps.prbody.outputs.title }}
          body: ${{ steps.prbody.outputs.body }}
          draft: ${{ steps.validate_build.outcome != 'success' }}

      # 🔴 `draft:` IS APPLIED ONLY ON CREATION. The action's own input doc says
      # so: "It is not possible to change draft status after creation except
      # through the web interface." Its branch is reused across runs, so without
      # this step a PR first opened by a FAILING run and then UPDATED by a later
      # SUCCESSFUL run would stay a draft forever — the bot would keep quietly
      # not-landing a fix that is now fine, which is #530 again in slow motion.
      #
      # `gh pr ready` is a GraphQL `markPullRequestReadyForReview`, covered by
      # the same fine-grained token's `Pull requests: write`. The `isDraft` read
      # first is not decoration: `gh pr ready` errors on an already-ready PR, and
      # errexit is on in this file (see the ERREXIT NOTE at the top).
      #
      # RESIDUAL, stated rather than papered over: the mirror case is NOT closed.
      # A PR created READY by a good run and then updated by a run whose build
      # fails cannot be demoted to draft (same action limitation, and `gh` has no
      # un-ready verb for it). What that run does change is the title and the
      # body, both of which lead with the failure banner, and the job still ends
      # red and files an issue. A ready-for-review PR carrying a `DO NOT MERGE
      # UNREVIEWED` title is the worst case this wiring ships with.
      - name: mark the PR ready for review once the build validates
        id: pr_ready
        if: >-
          always()
          && steps.pr.outputs.pull-request-number != ''
          && steps.validate_build.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.BUMP_SCAFFOLD_PINS_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
        run: |
          set -uo pipefail
          if [ "$(gh pr view "$PR" --json isDraft --jq .isDraft)" = "true" ]; then
            echo "PR #$PR is a draft left by an earlier failing run; the build validates now — marking it ready."
            gh pr ready "$PR"
          else
            echo "PR #$PR is already ready for review — nothing to do."
          fi

  # Compose ONE report out of the two independent jobs above.
  #
  # It is a separate job rather than a step inside `bump` because it has to see
  # BOTH results, and it is the only place that writes prose — `bump` exports
  # raw step outcomes precisely so there is a single author for the message.
  #
  # `always()` so it still runs after a failed job; `!= 'cancelled'` on both
  # needs so a hand cancellation is not filed as a defect.
  classify:
    needs: [ready-ack-runtime, bump]
    if: always() && needs.ready-ack-runtime.result != 'cancelled' && needs.bump.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      state: ${{ steps.classify.outputs.state }}
      title: ${{ steps.classify.outputs.title }}
      body: ${{ steps.classify.outputs.body }}
    steps:
      - name: classify the outcome
        id: classify
        env:
          J_READY: ${{ needs.ready-ack-runtime.result }}
          J_BUMP: ${{ needs.bump.result }}
          R_BUMP: ${{ needs.bump.outputs.r_bump }}
          R_CHANGED: ${{ needs.bump.outputs.r_changed }}
          R_PINS: ${{ needs.bump.outputs.r_pins }}
          R_SUITE: ${{ needs.bump.outputs.r_suite }}
          R_BUILD: ${{ needs.bump.outputs.r_build }}
          R_PR: ${{ needs.bump.outputs.r_pr }}
          R_READY: ${{ needs.bump.outputs.r_ready }}
          PR_URL: ${{ needs.bump.outputs.pr_url }}
          DRILL: ${{ (github.event_name == 'workflow_dispatch' && inputs.drill) || 'none' }}
        run: |
          set -uo pipefail

          # ---- the ready-ack drift runner's verdict ---------------------------
          ready_state=""
          ready_title=""
          ready_detail=""
          if [ "$J_READY" != "success" ]; then
            ready_state=ready-ack-failed
            ready_title="the scaffolded ready-ack handshake no longer fires on \`main\`"
            ready_detail="The \`ready-ack-runtime\` job failed. It runs the vendored emitter in node against a fake host and asserts one correctly-addressed \`{type:'BLOCK_READY',payload:{height:0}}\` goes out — the ONLY check in the repo that proves the handshake actually fires rather than that the file is present.

          A red here means a \`page\` app scaffolded from \`main\` today may never reach \`ready\` in the host and would end at a failure card, which is issue #206 all over again. It can also mean the job's own positive control fired: it refuses to pass unless \`--- PASS: TestScaffoldedReadyAckActuallyFires\` is in the output, so a renamed/moved test reports here too. **The run log distinguishes them.**"
          fi

          # ---- the pin bumper's verdict ---------------------------------------
          bump_state=""
          bump_title=""
          bump_detail=""
          if [ "$J_BUMP" != "success" ]; then
            if [ "$R_BUMP" = "failure" ]; then
              bump_state=bump-failed
              bump_title="the scaffold pin bumper could not run the bumper"
              bump_detail="The \`bump stale @civitai/* scaffold pins\` step failed — \`go run ./internal/scaffold/cmd/bump-pins\` exited non-zero. It exits 2 only on a hard error (the template holds no \`@civitai/*\` pins at all, or one of the three literal sites could not be read/written); a transient npm lookup failure is a per-package SKIP inside the tool, not a failure, so this is not a network blip."
            elif [ "$R_CHANGED" = "failure" ]; then
              bump_state=detect-failed
              bump_title="the scaffold pin bumper failed while checking for changes"
              bump_detail="The \`detect changes\` step failed, which is unusual — it only runs \`git status\`."
            elif [ "$R_PINS" = "failure" ]; then
              bump_state=validate-pins-failed
              bump_title="the scaffold pin bumper produced pins that still do not satisfy npm"
              bump_detail="Pins were rewritten, but the network guard (\`CIVITAI_CHECK_PUBLISHED_PINS=1 go test -run TestScaffoldPinsSatisfyPublished\`) then said they still do not admit npm's published latest. **No PR was opened.** Either \`scaffold.DesiredPin\` and \`CaretAdmits\` disagree, or a package published again mid-run."
            elif [ "$R_SUITE" = "failure" ]; then
              bump_state=validate-suite-failed
              bump_title="the scaffold pin bumper broke the offline scaffold suite"
              bump_detail="Pins were rewritten and satisfy npm, but \`go test ./internal/scaffold/...\` then failed. **No PR was opened.** The usual cause is the bumper rewriting only some of the three literal sites, leaving the \`scaffold_test.go\` \`mustContain\` canary disagreeing with the template."
            elif [ "$R_BUILD" = "failure" ]; then
              # 🔴 THE SENTENCE THAT USED TO BE HERE COST THREE DAYS. It asserted
              # "**No PR was opened**, on purpose — this is the removed/renamed
              # SDK export case, and it is a real upstream break rather than a
              # bot bug." Both halves were false: a draft PR IS opened now, and
              # the one time this fired the cause was npm's arborist, not the
              # SDK. That text is what #524's body said, and it is what sent the
              # investigation at the wrong half of the stack (#530).
              #
              # So this verdict states the MEASUREMENT, enumerates the causes
              # WITHOUT picking one, says the enumeration is open, and hands the
              # reader the probe that discriminates. Do not re-narrow it into a
              # confident diagnosis; this job has never had the evidence for one.
              pr_line=""
              if [ "$R_PR" = "success" ] && [ -n "$PR_URL" ]; then
                pr_line="**A DRAFT PR was opened anyway: $PR_URL** — deliberately, because withholding it is what froze the repo. Draft means GitHub will not let it merge until a human marks it ready, and its title and body both lead with the failure. It carries the pin bump only; it does NOT fix whatever failed below. Do not mark it ready until you know which case this is."
              elif [ "$R_PR" = "success" ]; then
                pr_line="**A DRAFT PR was opened anyway**, deliberately, because withholding it is what froze the repo — but its URL did not reach this report, so open the run's \`bump\` job to find it. Draft means it cannot merge until a human marks it ready."
              else
                pr_line="**No PR was opened** — the \`open PR if pins changed\` step did not succeed either (\`r_pr=$R_PR\`), which is a SECOND failure on top of the build one. So the pin fix is un-merged and \`pins-vs-published\` (a REQUIRED check on \`main\`) stays red, blocking every open PR, until someone bumps the pins by hand."
              fi
              bump_state=validate-build-failed
              bump_title="the scaffold did not build against the newly-bumped @civitai/* pins"
              bump_detail="**What was measured.** Pins were rewritten and they satisfy npm's published latest; the offline scaffold suite is green. The LAST check then failed: a fresh \`civitai app init … --template page-money\` at the bumped pins did not install, typecheck or build. The step runs \`npm install\` → \`npm run typecheck\` → \`npm run build\` and this report does not record which of the three died — **the run log does, and it is the first thing to read.**

          $pr_line

          **What this does NOT say: which cause it is.** At least two produce this exact outcome, nothing in this report distinguishes them, and the list is OPEN — treat it as a starting set, not an enumeration of the possible:

          1. **A genuine upstream break** — a removed or renamed \`@civitai/*\` export the template still imports. If so, every newly-scaffolded page-money app is affected until the template is adapted or the SDK is fixed.
          2. **An npm-side install crash** with nothing wrong in the SDK at all. This is measured precedent, not a hypothetical: npm 10's arborist dies with \`Cannot read properties of null (reading 'edgesOut')\` on the UNMODIFIED page-money template, which is why this workflow and \`ci.yml\` both pin node 24 (npm 11). Issue #524 was this classifier asserting case 1 while the cause was case 2.

          **The discriminating probe.** Run it locally against the pins this run proposed:

          \`\`\`
          go run ./cmd/civitai app init Probe --dir /tmp/pin-probe --template page-money
          # edit /tmp/pin-probe/package.json to the @civitai/* pins from this run's diff
          cd /tmp/pin-probe && npm install --no-audit --no-fund && npm run typecheck && npm run build
          \`\`\`

          - dies inside \`npm install\` with a tree-walk error (\`edgesOut\`, a null read, \`ERESOLVE\`) → **case 2**; re-run under a different node/npm major and compare before touching the template.
          - installs, then fails \`typecheck\` or \`build\` naming a missing import/export → **case 1**, and the error names the export.
          - passes clean on your machine → the difference is the runner's environment, not the pins."
            elif [ "$R_PR" = "failure" ]; then
              bump_state=pr-failed
              bump_title="the scaffold pin bumper could not open its PR"
              bump_detail="The pins were bumped and fully validated, but opening the PR failed — usually \`secrets.BUMP_SCAFFOLD_PINS_TOKEN\` being expired or missing. **The fix is still un-merged**, so \`pins-vs-published\` (a REQUIRED check on \`main\`) stays red and blocks EVERY open PR regardless of its content, until someone bumps the pins by hand or repairs the token."
            elif [ "$R_READY" = "failure" ]; then
              bump_state=pr-ready-failed
              bump_title="the scaffold pin bumper opened its PR but could not take it out of draft"
              bump_detail="Everything validated and the PR was opened/updated, but the \`mark the PR ready for review once the build validates\` step failed. That step exists because \`peter-evans/create-pull-request\` applies \`draft:\` **only on creation**, so a PR first opened by an earlier failing run stays a draft until \`gh pr ready\` flips it. **The PR is therefore probably still a DRAFT and cannot merge** — check it and mark it ready by hand. Likely causes: \`secrets.BUMP_SCAFFOLD_PINS_TOKEN\` lacking \`Pull requests: write\`, or expired."
            else
              # No step recorded a failure, yet the job is not green: it died
              # before/outside its own steps (runner failure, checkout failure,
              # setup-go failure). That is a real and different state.
              bump_state=bump-unknown
              bump_title="the scaffold pin bumper could not run"
              bump_detail="The \`bump\` job did not succeed, but none of its steps recorded a failure — so it died before or outside them. The usual causes are the runner dying, the checkout failing, or \`setup-go\` failing. Check the run log."
            fi
          fi

          # ---- combine ---------------------------------------------------------
          if [ -n "$ready_state" ] && [ -n "$bump_state" ]; then
            state="$ready_state+$bump_state"
            title="both scheduled scaffold checks are failing"
            detail="**Two independent failures in one run.** They are unrelated jobs; treat them as two problems.

          ## 1. ready-ack runtime

          $ready_detail

          ## 2. pin bumper

          $bump_detail"
          elif [ -n "$ready_state" ]; then
            state="$ready_state"
            title="$ready_title"
            detail="$ready_detail"
          elif [ -n "$bump_state" ]; then
            state="$bump_state"
            title="$bump_title"
            detail="$bump_detail"
          else
            state=green
            title=""
            detail=""
          fi

          DRILL_NOTE=""
          if [ "$DRILL" != "none" ]; then
            DRILL_NOTE="> ⚠️ **This is a fire drill**, dispatched by hand with \`drill=$DRILL\`. The named job(s) were failed on purpose before doing any work — no npm lookup, no test, no pin rewritten — so this is NOT a real failure of the bot. It exists to prove this reporting path works. Close it when you are done."
          fi

          echo "state=$state"
          {
            echo "state=$state"
            echo "title=[scaffold-pins-bot] $title"
            echo "body<<SCAFFOLD_PINS_BODY_EOF"
            if [ -n "$DRILL_NOTE" ]; then
              echo "$DRILL_NOTE"
              echo
            fi
            echo "$detail"
            echo
            echo "---"
            echo "This workflow runs two independent daily checks: \`ready-ack-runtime\` (does the scaffolded handshake still fire on \`main\`) and \`bump\` (are the template's \`@civitai/*\` pins still current). Either one failing files this issue."
            echo "SCAFFOLD_PINS_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

  # File a report when either check is broken, and close it when both recover.
  # See `failure-issue.yml` for why this is an issue rather than email, and for
  # the rules that stop it becoming noise.
  #
  # `failing` is computed from the JOB results rather than from `classify`'s
  # output, so a `classify` job that itself dies still reports — as `unknown`,
  # which is a real state and not silence. "The check could not run" must be as
  # visible as "the check failed".
  signal:
    needs: [ready-ack-runtime, bump, classify]
    if: always() && needs.ready-ack-runtime.result != 'cancelled' && needs.bump.result != 'cancelled' && needs.classify.result != 'cancelled'
    uses: ./.github/workflows/failure-issue.yml
    permissions:
      contents: read
      issues: write
    with:
      marker: "[scaffold-pins-bot]"
      failing: ${{ needs.ready-ack-runtime.result != 'success' || needs.bump.result != 'success' || needs.classify.result != 'success' }}
      state: ${{ needs.classify.outputs.state || 'unknown' }}
      title: "${{ needs.classify.outputs.title || '[scaffold-pins-bot] the scaffold bots failed and could not say why' }}"
      body: "${{ needs.classify.outputs.body || 'The `classify` job did not produce a verdict, so this report cannot name which of `ready-ack-runtime` / `bump` went wrong, or how. Open the run and read both jobs. This state is itself a defect in the reporting path — `classify` only runs a shell script over the two job results.' }}"
